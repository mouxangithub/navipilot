name: Release OTA

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (must be greater than latest, e.g. 260725)'
        required: true
      version_name:
        description: 'versionName (e.g. v260725)'
        required: true
      notes:
        description: 'release notes'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          gh release create "r$VERSION_CODE"             app/build/outputs/apk/debug/app-debug.apk             --title "sunnypilot-dazi r$VERSION_CODE"             --notes "$NOTES"             --target master
